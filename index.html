<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Let’s Speak</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #dbeafe 0%, #fce7f3 50%, #ede9fe 100%);
      --card-bg: #ffffff;
      --card-shadow: 0 20px 45px rgba(148, 163, 184, 0.4);
      --btn-bg: #ffffff;
      --btn-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
      --btn-hover-shadow: 0 10px 24px rgba(0, 0, 0, 0.14);
      --primary-color: #2563eb;
      --success-color: #10b981;
      --error-color: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--bg-gradient);
      padding: env(safe-area-inset-top, 16px) env(safe-area-inset-right, 16px) env(safe-area-inset-bottom, 16px) env(safe-area-inset-left, 16px);
      box-sizing: border-box;
      overflow-x: hidden;
    }

    /* 白色主要容器：支援各螢幕高度彈性滾動，杜絕摺疊機/平板裁切 */
    .app-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 820px;
      max-height: 94vh;
      max-height: 94dvh;
      border-radius: 32px;
      box-shadow: var(--card-shadow);
      padding: clamp(16px, 2.5vh, 28px) clamp(16px, 3vw, 36px);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .header-box {
      text-align: center;
      flex-shrink: 0;
      margin-bottom: clamp(10px, 1.8vh, 18px);
    }

    .main-title {
      font-size: clamp(1.6rem, 3.5vh, 2.5rem);
      font-weight: 800;
      color: #1e293b;
      letter-spacing: 0.5px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .bracket {
      color: #94a3b8;
      font-weight: 300;
      font-size: clamp(1.8rem, 3.8vh, 2.9rem);
    }

    .arch-curve {
      width: 85%;
      height: 6px;
      margin: 2px auto 0;
      border-radius: 50%;
      border-top: 3px solid #cbd5e1;
    }

    .view-section {
      width: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.25s ease-in-out;
    }

    .view-section.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 扉頁（首頁）：向上向下靠齊中央主體 */
    #view-cover {
      gap: clamp(16px, 3vh, 28px);
    }

    .books-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: clamp(12px, 2.5vw, 32px);
      width: 100%;
    }

    .book-item {
      position: relative;
      width: min(28vw, 175px);
      aspect-ratio: 1 / 1.45;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 24px rgba(30, 41, 59, 0.16);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .book-item:hover {
      transform: translateY(-5px) scale(1.02);
      box-shadow: 0 18px 32px rgba(30, 41, 59, 0.22);
    }

    .book-item img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .btn-capsule {
      background: var(--btn-bg);
      color: #334155;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      border: 2px solid #e2e8f0;
      padding: 12px 64px;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: var(--btn-shadow);
      transition: all 0.2s ease;
    }

    .btn-capsule:hover {
      transform: translateY(-2px);
      box-shadow: var(--btn-hover-shadow);
      border-color: #cbd5e1;
      color: #0f172a;
    }

    /* 選單頁：上下貼緊中間九宮格，消除上下空隙 */
    #view-topics {
      gap: clamp(14px, 2.2vh, 24px);
    }

    .topics-columns-container {
      width: 100%;
      max-width: 680px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(10px, 1.8vw, 16px);
    }

    .book-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .column-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: #64748b;
      margin-bottom: 2px;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .unit-pill-btn {
      width: 100%;
      background: #ffffff;
      border: 1.8px solid #e2e8f0;
      border-radius: 20px;
      padding: 12px 4px;
      font-size: 0.95rem;
      font-weight: 700;
      color: #334155;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(0,0,0,0.04);
      transition: all 0.2s ease;
      text-align: center;
      white-space: nowrap;
    }

    .unit-pill-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(0,0,0,0.08);
    }

    .unit-pill-btn.book1:hover { border-color: #ef4444; color: #ef4444; }
    .unit-pill-btn.book2:hover { border-color: #3b82f6; color: #3b82f6; }
    .unit-pill-btn.book3:hover { border-color: #10b981; color: #10b981; }

    .btn-back {
      background: transparent;
      border: none;
      color: #64748b;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }

    .btn-back:hover { color: #0f172a; }

    /* 答題進度條組件 */
    .progress-track-wrapper {
      width: 100%;
      background: #e2e8f0;
      height: 8px;
      border-radius: 10px;
      margin-bottom: 12px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3b82f6, #2563eb);
      border-radius: 10px;
      transition: width 0.35s ease;
    }

    .progress-bar-fill.partB-bar {
      background: linear-gradient(90deg, #ec4899, #be185d);
    }

    /* 第一大題：單字排序 */
    .quiz-view-wrapper {
      width: 100%;
      max-width: 740px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .quiz-nav-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .quiz-badge {
      padding: 4px 16px;
      background: #eff6ff;
      color: #1d4ed8;
      border-radius: 20px;
      font-size: 0.95rem;
      font-weight: 700;
    }

    .quiz-instruction-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #f8fafc;
      padding: 6px 16px;
      border-radius: 30px;
      border: 1px solid #e2e8f0;
      margin-bottom: 12px;
    }

    .btn-audio {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #3b82f6;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(59, 130, 246, 0.3);
      transition: all 0.2s;
    }

    .btn-audio:hover {
      background: #2563eb;
      transform: scale(1.03);
    }

    /* 卡片格柵：在摺疊機展開時等比縮放 */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(8px, 1.5vw, 12px);
      width: 100%;
      margin-bottom: clamp(8px, 1.5vh, 14px);
    }

    .order-card {
      position: relative;
      background: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: 14px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 3px 8px rgba(0,0,0,0.04);
      user-select: none;
    }

    .order-card:hover {
      border-color: #94a3b8;
      transform: translateY(-2px);
    }

    .order-card.selected {
      border-color: #3b82f6;
      background: #f0f7ff;
    }

    .order-card.correct {
      border-color: var(--success-color);
      background: #f0fdf4;
    }

    .order-card.wrong {
      border-color: var(--error-color);
      background: #fef2f2;
    }

    .circle-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid #60a5fa;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      font-weight: 800;
      color: #2563eb;
      box-shadow: 0 2px 5px rgba(0,0,0,0.06);
      z-index: 2;
    }

    .order-card.selected .circle-badge {
      background: #2563eb;
      color: #ffffff;
      border-color: #2563eb;
    }

    /* 圖片容器：自適應縱向視窗高，徹底防止摺疊機與平板裁切 */
    .card-thumb {
      width: 100%;
      aspect-ratio: 16 / 10;
      max-height: 14vh;
      border-radius: 8px;
      overflow: hidden;
      background: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 4px;
      padding: 2px;
    }

    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .card-word {
      font-size: 0.9rem;
      font-weight: 700;
      color: #1e293b;
      text-align: center;
    }

    .quiz-controls {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 6px;
    }

    .btn-action {
      background: #1e293b;
      color: white;
      border: none;
      padding: 8px 24px;
      border-radius: 20px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-action:hover {
      background: #0f172a;
      transform: translateY(-1px);
    }

    .btn-reset {
      background: #e2e8f0;
      color: #475569;
    }

    .btn-reset:hover {
      background: #cbd5e1;
    }

    .feedback-msg {
      font-size: 0.92rem;
      font-weight: 700;
      min-height: 22px;
      margin-bottom: 4px;
    }

    /* 第二大題樣式 */
    .part-b-box {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .audio-play-big-btn {
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 50px;
      padding: 10px 30px;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
      margin-bottom: 16px;
      transition: all 0.2s;
    }

    .audio-play-big-btn:hover {
      background: #1d4ed8;
      transform: translateY(-2px);
    }

    .options-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .option-btn {
      width: 100%;
      background: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      padding: 12px 18px;
      font-size: 0.98rem;
      font-weight: 700;
      color: #1e293b;
      cursor: pointer;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s;
      box-shadow: 0 3px 6px rgba(0,0,0,0.03);
    }

    .option-btn:hover:not(:disabled) {
      border-color: #3b82f6;
      background: #f8fafc;
      transform: translateX(4px);
    }

    .option-btn.correct {
      border-color: var(--success-color);
      background: #ecfdf5;
      color: #065f46;
    }

    .option-btn.wrong {
      border-color: var(--error-color);
      background: #fef2f2;
      color: #991b1b;
    }

    .option-label {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      font-weight: 800;
      color: #475569;
      flex-shrink: 0;
    }

    .option-btn.correct .option-label {
      background: var(--success-color);
      color: white;
    }

    .option-btn.wrong .option-label {
      background: var(--error-color);
      color: white;
    }

    .coming-soon-box {
      padding: 30px 16px;
      background: #f8fafc;
      border: 2px dashed #cbd5e1;
      border-radius: 24px;
      width: 100%;
      max-width: 440px;
      text-align: center;
      margin-bottom: 16px;
    }

    /* 平板橫向 / 摺疊機展開（高度較短時的自適應佈局） */
    @media (max-height: 740px) {
      .app-card {
        padding: 14px 20px;
      }
      .main-title {
        font-size: 1.5rem;
      }
      .header-box {
        margin-bottom: 8px;
      }
      .card-thumb {
        max-height: 11vh;
      }
      .card-word {
        font-size: 0.8rem;
      }
      .quiz-instruction-bar {
        margin-bottom: 8px;
        padding: 4px 12px;
      }
      .cards-grid {
        gap: 6px;
        margin-bottom: 6px;
      }
      .btn-action {
        padding: 6px 16px;
        font-size: 0.85rem;
      }
      .option-btn {
        padding: 8px 14px;
        font-size: 0.9rem;
      }
      .audio-play-big-btn {
        margin-bottom: 10px;
        padding: 8px 22px;
        font-size: 0.95rem;
      }
    }

    @media (max-width: 480px) {
      body { padding: 10px; }
      .app-card { border-radius: 24px; padding: 20px 12px; }
      .cards-grid { grid-template-columns: repeat(2, 1fr); gap: 6px; }
      .card-word { font-size: 0.8rem; }
      .circle-badge { width: 24px; height: 24px; font-size: 0.78rem; }
      .option-btn { font-size: 0.9rem; padding: 10px 12px; }
      .topics-columns-container { gap: 8px; }
    }
  </style>
</head>
<body>

  <main class="app-card">
    
    <!-- 頂部標題區 -->
    <header class="header-box">
      <h1 class="main-title">
        <span class="bracket">(</span>
        Let’s Speak
        <span class="bracket">)</span>
      </h1>
      <div class="arch-curve"></div>
    </header>

    <!-- 1. 扉頁（首頁）：向上向下靠齊中央主體 -->
    <section id="view-cover" class="view-section active">
      <div class="books-row">
        <div class="book-item" title="Book 1 (U1-U15)">
          <img src="images/book 1.png" alt="Let's Speak Book 1" onerror="this.src='https://placehold.co/240x350/e0e7ff/1e3a8a?text=Book+1'">
        </div>
        <div class="book-item" title="Book 2 (U1-U15)">
          <img src="images/book 2.png" alt="Let's Speak Book 2" onerror="this.src='https://placehold.co/240x350/fef2f2/ef4444?text=Book+2'">
        </div>
        <div class="book-item" title="Book 3 (U1-U15)">
          <img src="images/book 3.png" alt="Let's Speak Book 3" onerror="this.src='https://placehold.co/240x350/ecfdf5/047857?text=Book+3'">
        </div>
      </div>
      <button id="start-btn" class="btn-capsule" onclick="onStartClicked()">START</button>
    </section>

    <!-- 2. 選單頁：上下貼緊中間九宮格，消除上下空隙 -->
    <section id="view-topics" class="view-section">
      <div class="topics-columns-container">
        <!-- Book 1 -->
        <div class="book-column">
          <div class="column-title">Book 1</div>
          <button class="unit-pill-btn book1" onclick="startSectionQuiz('book1_u1_u5', 'Book 1 • U1~U5')">U1 - U5</button>
          <button class="unit-pill-btn book1" onclick="startSectionQuiz('book1_u6_u10', 'Book 1 • U6~U10')">U6 - U10</button>
          <button class="unit-pill-btn book1" onclick="startSectionQuiz('book1_u11_u15', 'Book 1 • U11~U15')">U11 - U15</button>
        </div>
        <!-- Book 2 -->
        <div class="book-column">
          <div class="column-title">Book 2</div>
          <button class="unit-pill-btn book2" onclick="startSectionQuiz('book2_u1_u5', 'Book 2 • U1~U5')">U1 - U5</button>
          <button class="unit-pill-btn book2" onclick="startSectionQuiz('book2_u6_u10', 'Book 2 • U6~U10')">U6 - U10</button>
          <button class="unit-pill-btn book2" onclick="startSectionQuiz('book2_u11_u15', 'Book 2 • U11~U15')">U11 - U15</button>
        </div>
        <!-- Book 3 -->
        <div class="book-column">
          <div class="column-title">Book 3</div>
          <button class="unit-pill-btn book3" onclick="startSectionQuiz('book3_u1_u5', 'Book 3 • U1~U5')">U1 - U5</button>
          <button class="unit-pill-btn book3" onclick="startSectionQuiz('book3_u6_u10', 'Book 3 • U6~U10')">U6 - U10</button>
          <button class="unit-pill-btn book3" onclick="startSectionQuiz('book3_u11_u15', 'Book 3 • U11~U15')">U11 - U15</button>
        </div>
      </div>
      <button class="btn-back" onclick="navigateTo('view-cover')">← 返回封面</button>
    </section>

    <!-- 3. 第一大題：單字聽力排序 -->
    <section id="view-quiz-partA" class="view-section">
      <div class="quiz-view-wrapper">
        <div class="quiz-nav-row">
          <span id="partA-section-badge" class="quiz-badge">第一大題 • 單字排序</span>
          <span id="partA-progress-badge" style="font-size: 0.9rem; color: #475569; font-weight: 700;">回合 1 / 3</span>
        </div>

        <!-- 答題進度條 -->
        <div class="progress-track-wrapper">
          <div id="partA-progress-bar" class="progress-bar-fill"></div>
        </div>

        <div class="quiz-instruction-bar">
          <button id="btn-play-partA" class="btn-audio" onclick="playCurrentRoundAudio()">
            <span>🔊 播放音檔</span>
          </button>
          <span style="font-size: 0.85rem; color: #475569; font-weight: 600;">聽音檔順序為圖片填入 1~6</span>
        </div>

        <div id="cards-container" class="cards-grid"></div>

        <div class="quiz-controls">
          <button class="btn-action btn-reset" onclick="resetUserOrder()">重置順序</button>
          <button class="btn-action" onclick="submitPartAAnswer()">送出答案</button>
          <button id="btn-next-round" class="btn-action" style="background:#2563eb; display:none;" onclick="nextPartARound()">下一回 →</button>
          <button id="btn-to-partB" class="btn-action" style="background:#10b981; display:none;" onclick="startPartB()">進入第二大題 →</button>
        </div>

        <div id="partA-feedback-text" class="feedback-msg"></div>
        <button class="btn-back" onclick="navigateTo('view-topics')">← 返回選單</button>
      </div>
    </section>

    <!-- 4. 第二大題：句子回應聽力選擇 -->
    <section id="view-quiz-partB" class="view-section">
      <div class="part-b-box">
        <div class="quiz-nav-row">
          <span id="partB-section-badge" class="quiz-badge" style="background: #fdf2f8; color: #be185d;">第二大題 • 聽力問答</span>
          <span id="partB-progress-badge" style="font-size: 0.9rem; color: #475569; font-weight: 700;">第 1 / 5 題</span>
        </div>

        <!-- 答題進度條 -->
        <div class="progress-track-wrapper">
          <div id="partB-progress-bar" class="progress-bar-fill partB-bar"></div>
        </div>

        <button id="btn-play-partB" class="audio-play-big-btn" onclick="playPartBCurrentAudio()">
          <span>🔊 點我播放題目語音</span>
        </button>

        <div class="options-list" id="options-container"></div>

        <div id="partB-feedback-text" class="feedback-msg"></div>

        <button id="btn-next-partB" class="btn-action" style="background:#2563eb; display:none; margin-top:6px; margin-bottom:12px;" onclick="nextPartBQuestion()">下一題 →</button>
        <button id="btn-finish-all" class="btn-action" style="background:#10b981; display:none; margin-top:6px; margin-bottom:12px;" onclick="finishAllQuizzes()">完成所有練習 🎉</button>

        <button class="btn-back" onclick="navigateTo('view-topics')">← 返回選單</button>
      </div>
    </section>

    <!-- 5. 建設中提示區 -->
    <section id="view-coming-soon" class="view-section">
      <div class="coming-soon-box">
        <div style="font-size: 3rem; margin-bottom: 12px;">🎧</div>
        <h3 id="cs-title" style="color: #1e293b; margin-bottom: 8px;">單元準備中</h3>
        <p style="color: #64748b; font-size: 0.9rem;">此範圍之題庫與音檔即將上線！</p>
      </div>
      <button class="btn-back" onclick="navigateTo('view-topics')">← 返回選單</button>
    </section>

  </main>

  <!-- 引入題庫檔案（全冊全面掛載） -->
  <script src="book1_u1_u5.js"></script>
  <script src="book1_u6_u10.js"></script>
  <script src="book1_u11_u15.js"></script>
  <script src="book2_u1_u5.js"></script>
  <script src="book2_u6_u10.js"></script>
  <script src="book2_u11_u15.js"></script>
  <script src="book3_u1_u5.js"></script>
  <script src="book3_u6_u10.js"></script>
  <script src="book3_u11_u15.js"></script>

  <script>
    let activePartAData = null;
    let activePartBData = null;
    let currentSectionTitle = '';

    let currentPartBAudio = new Audio();
    let currentTtsAudio = new Audio();
    let audioTimeUpdateListener = null;
    let isAudioUnlocked = false;

    const TOTAL_PART_A_ROUNDS = 3;
    const ITEMS_PER_ROUND = 6;
    let partAGeneratedRounds = [];
    let currentPartARoundIdx = 0;
    let partASelections = [];

    const TOTAL_PART_B_QUESTIONS = 5;
    let partBPickedQuestions = [];
    let currentPartBQuestionIdx = 0;
    let partBScore = 0;

    function triggerUnlockAudio() {
      if (isAudioUnlocked) return;
      currentPartBAudio.play().then(() => { currentPartBAudio.pause(); }).catch(() => {});
      currentTtsAudio.play().then(() => { currentTtsAudio.pause(); }).catch(() => {});
      isAudioUnlocked = true;
    }

    if (typeof WeixinJSBridge === 'object' && typeof WeixinJSBridge.invoke === 'function') {
      triggerUnlockAudio();
    } else {
      document.addEventListener('WeixinJSBridgeReady', triggerUnlockAudio, false);
    }
    document.addEventListener('touchstart', triggerUnlockAudio, { once: true });

    function onStartClicked() {
      triggerUnlockAudio();
      navigateTo('view-topics');
    }

    function navigateTo(targetViewId) {
      stopCurrentAudio();
      document.querySelectorAll('.view-section').forEach(view => view.classList.remove('active'));
      const targetView = document.getElementById(targetViewId);
      if (targetView) targetView.classList.add('active');
    }

    function stopCurrentAudio() {
      if (currentPartBAudio) {
        currentPartBAudio.pause();
        if (audioTimeUpdateListener) {
          currentPartBAudio.removeEventListener('timeupdate', audioTimeUpdateListener);
          audioTimeUpdateListener = null;
        }
      }
      if (currentTtsAudio) {
        currentTtsAudio.pause();
        currentTtsAudio.onended = null;
        currentTtsAudio.onerror = null;
      }
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    }

    function openComingSoon(bookName, range) {
      document.getElementById('cs-title').textContent = `${bookName} • ${range}`;
      navigateTo('view-coming-soon');
    }

    function startSectionQuiz(sectionKey, sectionTitle) {
      triggerUnlockAudio();

      let pA = null, pB = null;
      if (sectionKey === 'book1_u1_u5') {
        pA = typeof book1_U1_U5_Data !== 'undefined' ? book1_U1_U5_Data : null;
        pB = typeof book1_PartB_Data !== 'undefined' ? book1_PartB_Data : null;
      } else if (sectionKey === 'book1_u6_u10') {
        pA = typeof book1_U6_U10_Data !== 'undefined' ? book1_U6_U10_Data : null;
        pB = typeof book1_PartB_U6_U10_Data !== 'undefined' ? book1_PartB_U6_U10_Data : null;
      } else if (sectionKey === 'book1_u11_u15') {
        pA = typeof book1_U11_U15_Data !== 'undefined' ? book1_U11_U15_Data : null;
        pB = typeof book1_PartB_U11_U15_Data !== 'undefined' ? book1_PartB_U11_U15_Data : null;
      } else if (sectionKey === 'book2_u1_u5') {
        pA = typeof book2_U1_U5_Data !== 'undefined' ? book2_U1_U5_Data : null;
        pB = typeof book2_PartB_U1_U5_Data !== 'undefined' ? book2_PartB_U1_U5_Data : null;
      } else if (sectionKey === 'book2_u6_u10') {
        pA = typeof book2_U6_U10_Data !== 'undefined' ? book2_U6_U10_Data : null;
        pB = typeof book2_PartB_U6_U10_Data !== 'undefined' ? book2_PartB_U6_U10_Data : null;
      } else if (sectionKey === 'book2_u11_u15') {
        pA = typeof book2_U11_U15_Data !== 'undefined' ? book2_U11_U15_Data : null;
        pB = typeof book2_PartB_U11_U15_Data !== 'undefined' ? book2_PartB_U11_U15_Data : null;
      } else if (sectionKey === 'book3_u1_u5') {
        pA = typeof book3_U1_U5_Data !== 'undefined' ? book3_U1_U5_Data : null;
        pB = typeof book3_PartB_U1_U5_Data !== 'undefined' ? book3_PartB_U1_U5_Data : null;
      } else if (sectionKey === 'book3_u6_u10') {
        pA = typeof book3_U6_U10_Data !== 'undefined' ? book3_U6_U10_Data : null;
        pB = typeof book3_PartB_U6_U10_Data !== 'undefined' ? book3_PartB_U6_U10_Data : null;
      } else if (sectionKey === 'book3_u11_u15') {
        pA = typeof book3_U11_U15_Data !== 'undefined' ? book3_U11_U15_Data : null;
        pB = typeof book3_PartB_U11_U15_Data !== 'undefined' ? book3_PartB_U11_U15_Data : null;
      }

      if (!pA || !pB) {
        alert('題庫檔案載入失敗，請確認檔案已放置於同一目錄：' + sectionKey + '.js');
        return;
      }

      activePartAData = pA;
      activePartBData = pB;
      currentSectionTitle = sectionTitle;

      currentPartBAudio.src = activePartBData.audioFile;
      currentPartBAudio.load();

      initPartA();
      navigateTo('view-quiz-partA');
    }

    /* ================= 第一大題邏輯 ================= */
    function initPartA() {
      let allItemsPool = [];
      activePartAData.forEach(unitData => {
        unitData.items.forEach(item => {
          allItemsPool.push({ ...item, sourceUnit: unitData.unit });
        });
      });

      partAGeneratedRounds = [];
      let shuffledPool = [...allItemsPool].sort(() => Math.random() - 0.5);

      for (let r = 0; r < TOTAL_PART_A_ROUNDS; r++) {
        if (shuffledPool.length < ITEMS_PER_ROUND) {
          shuffledPool = [...allItemsPool].sort(() => Math.random() - 0.5);
        }
        const picked = shuffledPool.splice(0, ITEMS_PER_ROUND);
        const displayItems = [...picked].sort(() => Math.random() - 0.5);
        const correctSequenceWords = [...picked].sort(() => Math.random() - 0.5).map(i => i.word);

        partAGeneratedRounds.push({
          round: r + 1,
          displayItems: displayItems,
          correctOrderWords: correctSequenceWords
        });
      }

      currentPartARoundIdx = 0;
      loadPartARound(currentPartARoundIdx);
    }

    function loadPartARound(roundIdx) {
      const roundData = partAGeneratedRounds[roundIdx];
      partASelections = [];

      document.getElementById('partA-section-badge').textContent = `${currentSectionTitle} • 單字排序`;
      document.getElementById('partA-progress-badge').textContent = `回合 ${roundIdx + 1} / ${TOTAL_PART_A_ROUNDS}`;
      
      const progressPercent = Math.round(((roundIdx) / TOTAL_PART_A_ROUNDS) * 100);
      document.getElementById('partA-progress-bar').style.width = `${progressPercent}%`;

      document.getElementById('partA-feedback-text').textContent = '';
      document.getElementById('btn-next-round').style.display = 'none';
      document.getElementById('btn-to-partB').style.display = 'none';

      const container = document.getElementById('cards-container');
      container.innerHTML = '';

      roundData.displayItems.forEach(item => {
        const card = document.createElement('div');
        card.className = 'order-card';
        card.id = `card-${item.id}`;
        card.onclick = () => toggleSelectPartACard(item.word);

        card.innerHTML = `
          <div class="circle-badge" id="badge-${item.word}"></div>
          <div class="card-thumb">
            <img src="${item.image}" alt="${item.word}" onerror="this.src='https://placehold.co/300x180/f8fafc/64748b?text=${encodeURIComponent(item.word)}'">
          </div>
          <div class="card-word">${item.word}</div>
        `;
        container.appendChild(card);
      });
    }

    function toggleSelectPartACard(word) {
      const existingIndex = partASelections.indexOf(word);
      if (existingIndex > -1) {
        partASelections.splice(existingIndex, 1);
      } else {
        if (partASelections.length < ITEMS_PER_ROUND) {
          partASelections.push(word);
        }
      }
      updatePartACardsUI();
    }

    function updatePartACardsUI() {
      const roundData = partAGeneratedRounds[currentPartARoundIdx];
      roundData.displayItems.forEach(item => {
        const card = document.getElementById(`card-${item.id}`);
        const badge = document.getElementById(`badge-${item.word}`);
        const orderIndex = partASelections.indexOf(item.word);

        if (orderIndex > -1) {
          card.classList.add('selected');
          badge.textContent = orderIndex + 1;
        } else {
          card.classList.remove('selected', 'correct', 'wrong');
          badge.textContent = '';
        }
      });
    }

    function resetUserOrder() {
      partASelections = [];
      updatePartACardsUI();
      document.getElementById('partA-feedback-text').textContent = '';
      document.getElementById('btn-next-round').style.display = 'none';
      document.getElementById('btn-to-partB').style.display = 'none';
    }

    function playCurrentRoundAudio() {
      const roundData = partAGeneratedRounds[currentPartARoundIdx];
      stopCurrentAudio();

      const btn = document.getElementById('btn-play-partA');
      btn.innerHTML = `<span>⏳ 播放中...</span>`;

      const ua = navigator.userAgent.toLowerCase();
      const isWeChat = ua.includes('micromessenger');
      const isLine = ua.includes('line');

      if (!isWeChat && !isLine && ('speechSynthesis' in window)) {
        try {
          window.speechSynthesis.cancel();

          const fullSpeech = roundData.correctOrderWords
            .map((w, idx) => `Number ${idx + 1}, ${w}`)
            .join('. ');

          const utterance = new SpeechSynthesisUtterance(fullSpeech);
          utterance.lang = 'en-US';
          utterance.rate = 0.86;

          utterance.onend = () => {
            btn.innerHTML = `<span>🔊 播放音檔</span>`;
          };

          utterance.onerror = () => {
            playAudioQueueByTag(roundData.correctOrderWords, btn);
          };

          window.speechSynthesis.speak(utterance);

          setTimeout(() => {
            if (btn.innerHTML.includes('播放中')) {
              btn.innerHTML = `<span>🔊 播放音檔</span>`;
            }
          }, 14000);
          return;
        } catch (err) {}
      }

      playAudioQueueByTag(roundData.correctOrderWords, btn);
    }

    function playAudioQueueByTag(wordsArray, btn) {
      let queue = [];

      wordsArray.forEach((phrase, idx) => {
        queue.push({ text: `Number`, pause: 150 });
        queue.push({ text: `${idx + 1}`, pause: 450 });

        const words = phrase.trim().split(/\s+/);
        words.forEach((w, wIdx) => {
          const isLastWord = (wIdx === words.length - 1);
          queue.push({ 
            text: w.replace(/[^a-zA-Z0-9]/g, ''), 
            pause: isLastWord ? 750 : 180 
          });
        });
      });

      let currentStep = 0;
      let timer = null;

      function playNext() {
        if (timer) {
          clearTimeout(timer);
          timer = null;
        }

        if (currentStep >= queue.length) {
          if (btn) btn.innerHTML = `<span>🔊 播放音檔</span>`;
          return;
        }

        const item = queue[currentStep];
        currentStep++;

        if (!item.text) {
          playNext();
          return;
        }

        const soundUrl = `https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(item.text)}&type=2`;
        currentTtsAudio.src = soundUrl;

        currentTtsAudio.onended = () => {
          timer = setTimeout(playNext, item.pause);
        };

        currentTtsAudio.onerror = () => {
          timer = setTimeout(playNext, 100);
        };

        const playPromise = currentTtsAudio.play();
        if (playPromise !== undefined) {
          playPromise.catch(err => {
            console.warn("Play error:", err);
            timer = setTimeout(playNext, 120);
          });
        }

        timer = setTimeout(() => {
          if (currentTtsAudio.paused) {
            playNext();
          }
        }, 2000);
      }

      playNext();
    }

    function submitPartAAnswer() {
      if (partASelections.length < ITEMS_PER_ROUND) {
        const fb = document.getElementById('partA-feedback-text');
        fb.style.color = '#ef4444';
        fb.textContent = '請先為全部 6 張圖片完成排序再送出！';
        return;
      }

      const roundData = partAGeneratedRounds[currentPartARoundIdx];
      let isAllCorrect = true;

      roundData.displayItems.forEach(item => {
        const card = document.getElementById(`card-${item.id}`);
        const userOrder = partASelections.indexOf(item.word);
        const correctOrder = roundData.correctOrderWords.indexOf(item.word);

        if (userOrder === correctOrder) {
          card.classList.add('correct');
        } else {
          card.classList.add('wrong');
          isAllCorrect = false;
        }
      });

      const fb = document.getElementById('partA-feedback-text');
      if (isAllCorrect) {
        fb.style.color = '#10b981';
        fb.textContent = '🎉 太棒了！本回排序全數正確！';
        
        const completedPercent = Math.round(((currentPartARoundIdx + 1) / TOTAL_PART_A_ROUNDS) * 100);
        document.getElementById('partA-progress-bar').style.width = `${completedPercent}%`;

        if (currentPartARoundIdx < TOTAL_PART_A_ROUNDS - 1) {
          document.getElementById('btn-next-round').style.display = 'inline-block';
        } else {
          document.getElementById('btn-to-partB').style.display = 'inline-block';
        }
      } else {
        fb.style.color = '#ef4444';
        fb.textContent = '❌ 有部分順序錯誤，可點擊「重置順序」再試一次！';
      }
    }

    function nextPartARound() {
      currentPartARoundIdx++;
      loadPartARound(currentPartARoundIdx);
    }

    /* ================= 第二大題邏輯 ================= */
    function startPartB() {
      triggerUnlockAudio();
      const allQ = [...activePartBData.questions];
      partBPickedQuestions = allQ.sort(() => Math.random() - 0.5).slice(0, TOTAL_PART_B_QUESTIONS);
      currentPartBQuestionIdx = 0;
      partBScore = 0;

      currentPartBAudio.src = activePartBData.audioFile;
      currentPartBAudio.load();

      navigateTo('view-quiz-partB');
      loadPartBQuestion(currentPartBQuestionIdx);
    }

    function loadPartBQuestion(qIdx) {
      const q = partBPickedQuestions[qIdx];
      document.getElementById('partB-section-badge').textContent = `${currentSectionTitle} • 聽力問答`;
      document.getElementById('partB-progress-badge').textContent = `第 ${qIdx + 1} / ${TOTAL_PART_B_QUESTIONS} 題`;

      const progressPercent = Math.round(((qIdx) / TOTAL_PART_B_QUESTIONS) * 100);
      document.getElementById('partB-progress-bar').style.width = `${progressPercent}%`;

      document.getElementById('partB-feedback-text').textContent = '';
      document.getElementById('btn-next-partB').style.display = 'none';
      document.getElementById('btn-finish-all').style.display = 'none';

      const playBtn = document.getElementById('btn-play-partB');
      playBtn.innerHTML = `<span>🔊 點我播放題目語音</span>`;

      const container = document.getElementById('options-container');
      container.innerHTML = '';

      q.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `<span class="option-label">${opt.label}</span><span>${opt.text}</span>`;
        btn.onclick = () => selectPartBOption(opt.label, q.answer, btn);
        container.appendChild(btn);
      });
    }

    function playPartBCurrentAudio() {
      const q = partBPickedQuestions[currentPartBQuestionIdx];
      stopCurrentAudio();

      const playBtn = document.getElementById('btn-play-partB');
      playBtn.innerHTML = `<span>⏳ 播放中...</span>`;

      const targetSrc = activePartBData.audioFile;
      if (!currentPartBAudio.src.endsWith(encodeURI(targetSrc)) && !currentPartBAudio.src.endsWith(targetSrc)) {
        currentPartBAudio.src = targetSrc;
        currentPartBAudio.load();
      }

      try {
        currentPartBAudio.currentTime = q.start;
      } catch (e) {
        console.warn("Seek error:", e);
      }

      if (audioTimeUpdateListener) {
        currentPartBAudio.removeEventListener('timeupdate', audioTimeUpdateListener);
        audioTimeUpdateListener = null;
      }

      audioTimeUpdateListener = function() {
        if (currentPartBAudio.currentTime >= q.end && currentPartBAudio.currentTime > q.start) {
          currentPartBAudio.pause();
          currentPartBAudio.removeEventListener('timeupdate', audioTimeUpdateListener);
          audioTimeUpdateListener = null;
          playBtn.innerHTML = `<span>🔊 再次播放題目</span>`;
        }
      };
      currentPartBAudio.addEventListener('timeupdate', audioTimeUpdateListener);

      const playPromise = currentPartBAudio.play();
      if (playPromise !== undefined) {
        playPromise.then(() => {
          playBtn.innerHTML = `<span>🔊 播放中...</span>`;
        }).catch(err => {
          console.warn("直接播放失敗，等待載入或再次點擊:", err);
          playBtn.innerHTML = `<span>🔊 點我播放題目語音</span>`;
        });
      }
    }

    function selectPartBOption(selectedLabel, correctLabel, clickedBtn) {
      stopCurrentAudio();
      document.getElementById('btn-play-partB').innerHTML = `<span>🔊 點我播放題目語音</span>`;

      document.querySelectorAll('.option-btn').forEach(btn => {
        btn.disabled = true;
      });

      const fb = document.getElementById('partB-feedback-text');

      if (selectedLabel === correctLabel) {
        clickedBtn.classList.add('correct');
        fb.style.color = '#10b981';
        fb.textContent = '🎉 答對了！';
        partBScore++;
      } else {
        clickedBtn.classList.add('wrong');
        fb.style.color = '#ef4444';
        fb.textContent = `❌ 答錯了！正確答案是 (${correctLabel})`;
      }

      const completedPercent = Math.round(((currentPartBQuestionIdx + 1) / TOTAL_PART_B_QUESTIONS) * 100);
      document.getElementById('partB-progress-bar').style.width = `${completedPercent}%`;

      if (currentPartBQuestionIdx < TOTAL_PART_B_QUESTIONS - 1) {
        document.getElementById('btn-next-partB').style.display = 'inline-block';
      } else {
        document.getElementById('btn-finish-all').style.display = 'inline-block';
      }
    }

    function nextPartBQuestion() {
      currentPartBQuestionIdx++;
      loadPartBQuestion(currentPartBQuestionIdx);
    }

    function finishAllQuizzes() {
      alert(`🎉 恭喜完成 ${currentSectionTitle} 所有練習！\n第二大題答對題數：${partBScore} / ${TOTAL_PART_B_QUESTIONS}`);
      navigateTo('view-topics');
    }
  </script>
</body>

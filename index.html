<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Let’s Speak</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #dbeafe 0%, #fce7f3 50%, #ede9fe 100%);
      --card-bg: #ffffff;
      --card-shadow: 0 20px 45px rgba(148, 163, 184, 0.4);
      --btn-bg: #ffffff;
      --btn-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
      --btn-hover-shadow: 0 10px 24px rgba(0, 0, 0, 0.14);
      --primary-color: #2563eb;
      --success-color: #10b981;
      --error-color: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--bg-gradient);
      padding: env(safe-area-inset-top, 16px) env(safe-area-inset-right, 16px) env(safe-area-inset-bottom, 16px) env(safe-area-inset-left, 16px);
      overflow-x: hidden;
    }

    /* 主卡片容器：上下貼齊 */
    .app-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 960px;
      height: 92vh;
      height: 92dvh;
      border-radius: 36px;
      box-shadow: var(--card-shadow);
      padding: clamp(16px, 3vh, 36px) clamp(16px, 3.5vw, 40px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }

    /* 頂部標題 */
    .header-box {
      text-align: center;
      flex-shrink: 0;
    }

    .main-title {
      font-size: clamp(1.8rem, 3.8vh, 3rem);
      font-weight: 800;
      color: #1e293b;
      letter-spacing: 0.5px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .bracket {
      color: #94a3b8;
      font-weight: 300;
      font-size: clamp(2rem, 4vh, 3.4rem);
    }

    .arch-curve {
      width: 85%;
      height: 6px;
      margin: 2px auto 0;
      border-radius: 50%;
      border-top: 3px solid #cbd5e1;
    }

    /* 視圖切換 */
    .view-section {
      width: 100%;
      flex: 1;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.25s ease-in-out;
      overflow-y: auto;
    }

    .view-section.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ================= 扉頁（首頁） ================= */
    .books-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: clamp(10px, 2.5vw, 36px);
      width: 100%;
      margin: auto 0;
    }

    .book-item {
      position: relative;
      width: min(28vw, 190px);
      aspect-ratio: 1 / 1.45;
      max-height: 48vh;
      border-radius: clamp(10px, 2vw, 18px);
      overflow: hidden;
      box-shadow: 0 10px 24px rgba(30, 41, 59, 0.16);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .book-item:hover {
      transform: translateY(-5px) scale(1.02);
      box-shadow: 0 18px 32px rgba(30, 41, 59, 0.22);
    }

    .book-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .btn-capsule {
      background: var(--btn-bg);
      color: #334155;
      font-size: clamp(1.1rem, 2vh, 1.4rem);
      font-weight: 800;
      letter-spacing: 1.5px;
      border: 2px solid #e2e8f0;
      padding: clamp(12px, 1.8vh, 16px) clamp(44px, 6vw, 84px);
      border-radius: 50px;
      cursor: pointer;
      box-shadow: var(--btn-shadow);
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .btn-capsule:hover {
      transform: translateY(-2px);
      box-shadow: var(--btn-hover-shadow);
      border-color: #cbd5e1;
      color: #0f172a;
    }

    /* ================= 選單頁（9 大主題） ================= */
    .topics-columns-container {
      width: 100%;
      max-width: 760px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(8px, 2vw, 24px);
      margin: auto 0;
    }

    .book-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(10px, 1.8vh, 18px);
    }

    .column-title {
      font-size: clamp(0.95rem, 1.8vh, 1.25rem);
      font-weight: 800;
      color: #64748b;
      margin-bottom: 2px;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .unit-pill-btn {
      width: 100%;
      background: #ffffff;
      border: 1.8px solid #e2e8f0;
      border-radius: 20px;
      padding: clamp(10px, 1.6vh, 18px) 4px;
      font-size: clamp(0.82rem, 1.6vh, 1.15rem);
      font-weight: 700;
      color: #334155;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(0,0,0,0.04);
      transition: all 0.2s ease;
      text-align: center;
      white-space: nowrap;
    }

    .unit-pill-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(0,0,0,0.08);
    }

    .unit-pill-btn.book1:hover { border-color: #ef4444; color: #ef4444; }
    .unit-pill-btn.book2:hover { border-color: #3b82f6; color: #3b82f6; }
    .unit-pill-btn.book3:hover { border-color: #10b981; color: #10b981; }

    .btn-back {
      background: transparent;
      border: none;
      color: #64748b;
      font-size: clamp(0.9rem, 1.6vh, 1.1rem);
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-back:hover { color: #0f172a; }

    /* ================= 排序作答練習區 ================= */
    .quiz-view-wrapper {
      width: 100%;
      max-width: 780px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: auto 0;
      padding: 10px 0;
    }

    .quiz-nav-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .quiz-badge {
      padding: 4px 16px;
      background: #eff6ff;
      color: #1d4ed8;
      border-radius: 20px;
      font-size: 0.95rem;
      font-weight: 700;
    }

    .quiz-instruction-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #f8fafc;
      padding: 8px 18px;
      border-radius: 30px;
      border: 1px solid #e2e8f0;
      margin-bottom: 14px;
    }

    .btn-audio {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #3b82f6;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(59, 130, 246, 0.3);
      transition: all 0.2s;
    }

    .btn-audio:hover {
      background: #2563eb;
      transform: scale(1.03);
    }

    /* 6 格圖片排序網格 */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(10px, 1.8vw, 16px);
      width: 100%;
      margin-bottom: 16px;
    }

    .order-card {
      position: relative;
      background: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: 14px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 3px 8px rgba(0,0,0,0.04);
      user-select: none;
    }

    .order-card:hover {
      border-color: #94a3b8;
      transform: translateY(-2px);
    }

    .order-card.selected {
      border-color: #3b82f6;
      background: #f0f7ff;
    }

    .order-card.correct {
      border-color: var(--success-color);
      background: #f0fdf4;
    }

    .order-card.wrong {
      border-color: var(--error-color);
      background: #fef2f2;
    }

    /* 序號圈圈 */
    .circle-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid #60a5fa;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      font-weight: 800;
      color: #2563eb;
      box-shadow: 0 2px 5px rgba(0,0,0,0.06);
    }

    .order-card.selected .circle-badge {
      background: #2563eb;
      color: #ffffff;
      border-color: #2563eb;
    }

    .card-thumb {
      width: 100%;
      aspect-ratio: 16 / 10;
      border-radius: 8px;
      overflow: hidden;
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 6px;
    }

    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-word {
      font-size: clamp(0.85rem, 1.4vh, 1.05rem);
      font-weight: 700;
      color: #1e293b;
    }

    /* 作答底部控制列 */
    .quiz-controls {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .btn-action {
      background: #1e293b;
      color: white;
      border: none;
      padding: 8px 24px;
      border-radius: 20px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-action:hover {
      background: #0f172a;
      transform: translateY(-1px);
    }

    .btn-reset {
      background: #e2e8f0;
      color: #475569;
    }

    .btn-reset:hover {
      background: #cbd5e1;
    }

    .feedback-msg {
      font-size: 0.95rem;
      font-weight: 700;
      margin-top: 8px;
      min-height: 24px;
    }

    /* 準備中視圖 */
    .coming-soon-box {
      padding: clamp(24px, 4vh, 36px) 16px;
      background: #f8fafc;
      border: 2px dashed #cbd5e1;
      border-radius: 24px;
      width: 100%;
      max-width: 460px;
      text-align: center;
      margin: auto 0;
    }

    @media (max-width: 480px) {
      body { padding: 10px; }
      .app-card { height: 94dvh; border-radius: 28px; padding: 18px 12px; }
      .cards-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .card-word { font-size: 0.8rem; }
      .circle-badge { width: 24px; height: 24px; font-size: 0.8rem; }
    }
  </style>
</head>
<body>

  <main class="app-card">
    
    <!-- 頂部標題區 -->
    <header class="header-box">
      <h1 class="main-title">
        <span class="bracket">(</span>
        Let’s Speak
        <span class="bracket">)</span>
      </h1>
      <div class="arch-curve"></div>
    </header>

    <!-- 1. 扉頁（首頁） -->
    <section id="view-cover" class="view-section active">
      <div class="books-row">
        <div class="book-item" title="Book 1 (U1-U15)">
          <img src="images/book 1.png" alt="Let's Speak Book 1" onerror="this.src='https://placehold.co/240x350/e0e7ff/1e3a8a?text=Book+1'">
        </div>
        <div class="book-item" title="Book 2 (U1-U15)">
          <img src="images/book 2.png" alt="Let's Speak Book 2" onerror="this.src='https://placehold.co/240x350/fef2f2/ef4444?text=Book+2'">
        </div>
        <div class="book-item" title="Book 3 (U1-U15)">
          <img src="images/book 3.png" alt="Let's Speak Book 3" onerror="this.src='https://placehold.co/240x350/ecfdf5/047857?text=Book+3'">
        </div>
      </div>
      <button id="start-btn" class="btn-capsule" onclick="navigateTo('view-topics')">START</button>
    </section>

    <!-- 2. 選單頁（9 大主題） -->
    <section id="view-topics" class="view-section">
      <div class="topics-columns-container">
        <!-- Book 1 -->
        <div class="book-column">
          <div class="column-title">Book 1</div>
          <button class="unit-pill-btn book1" onclick="startRandomQuiz(book1_U1_U5_Data, 'Book 1')">U1 - U5</button>
          <button class="unit-pill-btn book1" onclick="openComingSoon('Book 1', 'U6 - U10')">U6 - U10</button>
          <button class="unit-pill-btn book1" onclick="openComingSoon('Book 1', 'U11 - U15')">U11 - U15</button>
        </div>
        <!-- Book 2 -->
        <div class="book-column">
          <div class="column-title">Book 2</div>
          <button class="unit-pill-btn book2" onclick="openComingSoon('Book 2', 'U1 - U5')">U1 - U5</button>
          <button class="unit-pill-btn book2" onclick="openComingSoon('Book 2', 'U6 - U10')">U6 - U10</button>
          <button class="unit-pill-btn book2" onclick="openComingSoon('Book 2', 'U11 - U15')">U11 - U15</button>
        </div>
        <!-- Book 3 -->
        <div class="book-column">
          <div class="column-title">Book 3</div>
          <button class="unit-pill-btn book3" onclick="openComingSoon('Book 3', 'U1 - U5')">U1 - U5</button>
          <button class="unit-pill-btn book3" onclick="openComingSoon('Book 3', 'U6 - U10')">U6 - U10</button>
          <button class="unit-pill-btn book3" onclick="openComingSoon('Book 3', 'U11 - U15')">U11 - U15</button>
        </div>
      </div>
      <button class="btn-back" onclick="navigateTo('view-cover')">← 返回封面</button>
    </section>

    <!-- 3. 作答練習區 -->
    <section id="view-quiz" class="view-section">
      <div class="quiz-view-wrapper">
        <div class="quiz-nav-row">
          <span id="quiz-title-badge" class="quiz-badge">Book 1 • U1~U5 綜合挑戰</span>
          <span id="quiz-progress-badge" style="font-size: 0.85rem; color: #64748b; font-weight: 600;">回合 1 / 3</span>
        </div>

        <div class="quiz-instruction-bar">
          <button class="btn-audio" onclick="playCurrentRoundAudio()">
            <span>🔊 播放音檔</span>
          </button>
          <span style="font-size: 0.85rem; color: #475569; font-weight: 600;">請聽音檔順序為圖片填入 1~6</span>
        </div>

        <!-- 圖片題目網格 -->
        <div id="cards-container" class="cards-grid"></div>

        <!-- 控制按鈕 -->
        <div class="quiz-controls">
          <button class="btn-action btn-reset" onclick="resetUserOrder()">重置順序</button>
          <button class="btn-action" onclick="submitAnswer()">送出答案</button>
          <button id="btn-next" class="btn-action" style="background:#2563eb; display:none;" onclick="nextRound()">下一回 →</button>
        </div>

        <div id="feedback-text" class="feedback-msg"></div>
        <button class="btn-back" onclick="navigateTo('view-topics')">← 返回選單</button>
      </div>
    </section>

    <!-- 4. 建設中提示區 -->
    <section id="view-coming-soon" class="view-section">
      <div class="coming-soon-box">
        <div style="font-size: 3rem; margin-bottom: 12px;">🎧</div>
        <h3 id="cs-title" style="color: #1e293b; margin-bottom: 8px;">單元準備中</h3>
        <p style="color: #64748b; font-size: 0.9rem;">此範圍之獨立題庫與音檔即將上線！</p>
      </div>
      <button class="btn-back" onclick="navigateTo('view-topics')">← 返回選單</button>
    </section>

  </main>

  <!-- 引入外部題庫檔案 -->
  <script src="book1_u1_u5.js"></script>

  <script>
    const TOTAL_ROUNDS = 3;      // 總共玩三次
    const ITEMS_PER_ROUND = 6;    // 每回合 6 張圖
    let generatedRounds = [];     // 儲存隨機生成的 3 回合題目
    let currentRoundIndex = 0;
    let activeBookName = '';
    let userSelections = [];

    // 切換視圖
    function navigateTo(targetViewId) {
      document.querySelectorAll('.view-section').forEach(view => {
        view.classList.remove('active');
      });
      const targetView = document.getElementById(targetViewId);
      if (targetView) targetView.classList.add('active');
    }

    // 啟動五單元混搭隨機題庫（3 回合）
    function startRandomQuiz(rawBankData, bookName) {
      if (!rawBankData || rawBankData.length === 0) {
        alert('題庫資料載入失敗，請確認 book1_u1_u5.js 檔案是否存在！');
        return;
      }
      activeBookName = bookName;

      // 1. 將 U1 ~ U5 的所有單字抽成一個大單字池 (共 30 個單字)
      let allItemsPool = [];
      rawBankData.forEach(unitData => {
        unitData.items.forEach(item => {
          allItemsPool.push({
            ...item,
            sourceUnit: unitData.unit
          });
        });
      });

      // 2. 隨機生成 3 回合，每回從單字池隨機挑選 6 個不重複單字
      generatedRounds = [];
      let shuffledPool = [...allItemsPool].sort(() => Math.random() - 0.5);

      for (let r = 0; r < TOTAL_ROUNDS; r++) {
        // 如果池中單字不夠抽，再重新洗牌補足
        if (shuffledPool.length < ITEMS_PER_ROUND) {
          shuffledPool = [...allItemsPool].sort(() => Math.random() - 0.5);
        }
        const pickedItems = shuffledPool.splice(0, ITEMS_PER_ROUND);

        // 畫面展示的卡片順序隨機洗牌
        const displayItems = [...pickedItems].sort(() => Math.random() - 0.5);

        // 題目聽力的正確順序（1 到 6 的隨機排列）
        const correctSequenceWords = [...pickedItems].sort(() => Math.random() - 0.5).map(item => item.word);

        generatedRounds.push({
          round: r + 1,
          displayItems: displayItems,
          correctOrderWords: correctSequenceWords
        });
      }

      currentRoundIndex = 0;
      loadRound(currentRoundIndex);
      navigateTo('view-quiz');
    }

    // 未開放提示
    function openComingSoon(bookName, range) {
      document.getElementById('cs-title').textContent = `${bookName} • ${range}`;
      navigateTo('view-coming-soon');
    }

    // 載入指定回合
    function loadRound(roundIdx) {
      const roundData = generatedRounds[roundIdx];
      userSelections = [];

      document.getElementById('quiz-title-badge').textContent = `${activeBookName} • U1~U5 綜合挑戰`;
      document.getElementById('quiz-progress-badge').textContent = `回合 ${roundIdx + 1} / ${TOTAL_ROUNDS}`;
      document.getElementById('feedback-text').textContent = '';
      document.getElementById('btn-next').style.display = 'none';

      const container = document.getElementById('cards-container');
      container.innerHTML = '';

      roundData.displayItems.forEach(item => {
        const card = document.createElement('div');
        card.className = 'order-card';
        card.id = `card-${item.id}`;
        card.onclick = () => toggleSelectCard(item.word);

        card.innerHTML = `
          <div class="circle-badge" id="badge-${item.word}"></div>
          <div class="card-thumb">
            <img src="${item.image}" alt="${item.word}" onerror="this.src='https://placehold.co/300x180/f1f5f9/64748b?text=${encodeURIComponent(item.word)}'">
          </div>
          <div class="card-word">${item.word}</div>
        `;
        container.appendChild(card);
      });
    }

    // 點擊卡片設定或取消序號
    function toggleSelectCard(word) {
      const existingIndex = userSelections.indexOf(word);

      if (existingIndex > -1) {
        userSelections.splice(existingIndex, 1);
      } else {
        if (userSelections.length < ITEMS_PER_ROUND) {
          userSelections.push(word);
        }
      }
      updateCardsUI();
    }

    // 更新介面上的序號
    function updateCardsUI() {
      const roundData = generatedRounds[currentRoundIndex];
      roundData.displayItems.forEach(item => {
        const card = document.getElementById(`card-${item.id}`);
        const badge = document.getElementById(`badge-${item.word}`);
        const orderIndex = userSelections.indexOf(item.word);

        if (orderIndex > -1) {
          card.classList.add('selected');
          badge.textContent = orderIndex + 1;
        } else {
          card.classList.remove('selected', 'correct', 'wrong');
          badge.textContent = '';
        }
      });
    }

    // 重置順序
    function resetUserOrder() {
      userSelections = [];
      updateCardsUI();
      document.getElementById('feedback-text').textContent = '';
      document.getElementById('btn-next').style.display = 'none';
    }

    // 播放當前混搭回合音檔
    function playCurrentRoundAudio() {
      const roundData = generatedRounds[currentRoundIndex];
      // 依據本回合正確順序進行高品質語音朗讀
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const textToSpeak = roundData.correctOrderWords.map((w, idx) => `Number ${idx + 1}, ${w}`).join('. ');
        const utterance = new SpeechSynthesisUtterance(textToSpeak);
        utterance.lang = 'en-US';
        utterance.rate = 0.88;
        window.speechSynthesis.speak(utterance);
      } else {
        alert('瀏覽器未支援語音播放');
      }
    }

    // 驗證答案
    function submitAnswer() {
      if (userSelections.length < ITEMS_PER_ROUND) {
        const fb = document.getElementById('feedback-text');
        fb.style.color = '#ef4444';
        fb.textContent = '請先為全部 6 張圖片完成排序再送出！';
        return;
      }

      const roundData = generatedRounds[currentRoundIndex];
      let isAllCorrect = true;

      roundData.displayItems.forEach(item => {
        const card = document.getElementById(`card-${item.id}`);
        const userOrder = userSelections.indexOf(item.word);
        const correctOrder = roundData.correctOrderWords.indexOf(item.word);

        if (userOrder === correctOrder) {
          card.classList.add('correct');
        } else {
          card.classList.add('wrong');
          isAllCorrect = false;
        }
      });

      const fb = document.getElementById('feedback-text');
      if (isAllCorrect) {
        fb.style.color = '#10b981';
        fb.textContent = '🎉 太棒了！本回排序全數正確！';
        document.getElementById('btn-next').style.display = 'inline-block';
      } else {
        fb.style.color = '#ef4444';
        fb.textContent = '❌ 有部分順序錯誤，可點擊「重置順序」再試一次！';
      }
    }

    // 下一回合
    function nextRound() {
      if (currentRoundIndex < TOTAL_ROUNDS - 1) {
        currentRoundIndex++;
        loadRound(currentRoundIndex);
      } else {
        alert('🎉 恭喜你！已完成 3 回合全部挑戰！');
        navigateTo('view-topics');
      }
    }
  </script>
</body>
</html>

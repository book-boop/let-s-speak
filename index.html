<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Let’s Speak</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #dbeafe 0%, #fce7f3 50%, #ede9fe 100%);
      --card-bg: #ffffff;
      --card-shadow: 0 20px 45px rgba(148, 163, 184, 0.4);
      --btn-bg: #ffffff;
      --btn-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
      --btn-hover-shadow: 0 10px 24px rgba(0, 0, 0, 0.14);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    /* 支援 100dvh 防範手機瀏覽器網址列伸展影響 */
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--bg-gradient);
      padding: env(safe-area-inset-top, 16px) env(safe-area-inset-right, 16px) env(safe-area-inset-bottom, 16px) env(safe-area-inset-left, 16px);
      overflow-x: hidden;
    }

    /* 主卡片容器：電腦端上下貼齊（92dvh），手機端保證完整容納且不溢出 */
    .app-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 960px;
      height: 92vh;
      height: 92dvh;
      border-radius: 36px;
      box-shadow: var(--card-shadow);
      padding: clamp(20px, 3.5vh, 40px) clamp(16px, 4vw, 44px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }

    /* 頂部標題 */
    .header-box {
      text-align: center;
      flex-shrink: 0;
    }

    .main-title {
      font-size: clamp(1.8rem, 4vh, 3.2rem);
      font-weight: 800;
      color: #1e293b;
      letter-spacing: 0.5px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .bracket {
      color: #94a3b8;
      font-weight: 300;
      font-size: clamp(2rem, 4.5vh, 3.6rem);
    }

    .arch-curve {
      width: 85%;
      height: 6px;
      margin: 2px auto 0;
      border-radius: 50%;
      border-top: 3px solid #cbd5e1;
    }

    /* 頁面切換控制 */
    .view-section {
      width: 100%;
      flex: 1;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.25s ease-in-out;
    }

    .view-section.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ================= 扉頁（首頁）：書本與按鈕 ================= */
    .books-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: clamp(10px, 2.5vw, 36px);
      width: 100%;
      margin: auto 0;
    }

    .book-item {
      position: relative;
      /* 依視窗高寬自動約束，手機窄螢幕下以寬度 28vw 為主，電腦下以高度為主，避免超出卡片 */
      width: min(28vw, 190px);
      aspect-ratio: 1 / 1.45;
      max-height: 48vh;
      border-radius: clamp(10px, 2vw, 18px);
      overflow: hidden;
      box-shadow: 0 10px 24px rgba(30, 41, 59, 0.16);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .book-item:hover {
      transform: translateY(-5px) scale(1.02);
      box-shadow: 0 18px 32px rgba(30, 41, 59, 0.22);
    }

    .book-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* START 按鈕 */
    .btn-capsule {
      background: var(--btn-bg);
      color: #334155;
      font-size: clamp(1.1rem, 2vh, 1.4rem);
      font-weight: 800;
      letter-spacing: 1.5px;
      border: 2px solid #e2e8f0;
      padding: clamp(12px, 1.8vh, 16px) clamp(44px, 6vw, 84px);
      border-radius: 50px;
      cursor: pointer;
      box-shadow: var(--btn-shadow);
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .btn-capsule:hover {
      transform: translateY(-2px);
      box-shadow: var(--btn-hover-shadow);
      border-color: #cbd5e1;
      color: #0f172a;
    }

    .btn-capsule:active {
      transform: translateY(0);
    }

    /* ================= 選單頁（9 大主題） ================= */
    .topics-columns-container {
      width: 100%;
      max-width: 760px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(8px, 2vw, 24px);
      margin: auto 0;
    }

    .book-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(10px, 1.8vh, 18px);
    }

    .column-title {
      font-size: clamp(0.95rem, 1.8vh, 1.25rem);
      font-weight: 800;
      color: #64748b;
      margin-bottom: 2px;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .unit-pill-btn {
      width: 100%;
      background: #ffffff;
      border: 1.8px solid #e2e8f0;
      border-radius: 20px;
      padding: clamp(10px, 1.6vh, 18px) 4px;
      font-size: clamp(0.82rem, 1.6vh, 1.15rem);
      font-weight: 700;
      color: #334155;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(0,0,0,0.04);
      transition: all 0.2s ease;
      text-align: center;
      white-space: nowrap;
    }

    .unit-pill-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(0,0,0,0.08);
    }

    .unit-pill-btn.book1:hover { border-color: #ef4444; color: #ef4444; }
    .unit-pill-btn.book2:hover { border-color: #3b82f6; color: #3b82f6; }
    .unit-pill-btn.book3:hover { border-color: #10b981; color: #10b981; }

    /* 返回按鈕 */
    .btn-back {
      background: transparent;
      border: none;
      color: #64748b;
      font-size: clamp(0.9rem, 1.6vh, 1.1rem);
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-back:hover {
      color: #0f172a;
    }

    /* ================= 題目頁面 ================= */
    .quiz-view-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin: auto 0;
    }

    .quiz-header-badge {
      display: inline-block;
      padding: 6px 18px;
      background: #f1f5f9;
      color: #334155;
      border-radius: 30px;
      font-size: clamp(0.9rem, 1.6vh, 1.05rem);
      font-weight: 800;
      margin-bottom: 18px;
    }

    .coming-soon-box {
      padding: clamp(24px, 4vh, 36px) 16px;
      background: #f8fafc;
      border: 2px dashed #cbd5e1;
      border-radius: 24px;
      width: 100%;
      max-width: 460px;
      margin-bottom: 20px;
    }

    .coming-soon-icon {
      font-size: clamp(2.2rem, 4vh, 3rem);
      margin-bottom: 8px;
    }

    .coming-soon-text {
      color: #334155;
      font-size: clamp(1.1rem, 2vh, 1.25rem);
      font-weight: 800;
      margin-bottom: 6px;
    }

    .coming-soon-sub {
      color: #94a3b8;
      font-size: clamp(0.85rem, 1.4vh, 0.95rem);
      line-height: 1.4;
    }

    /* ================= 手機專屬響應微調 (Mobile Breakpoint) ================= */
    @media (max-width: 480px) {
      body {
        padding: 10px;
      }
      .app-card {
        height: 94dvh;
        border-radius: 28px;
        padding: 24px 14px 20px;
      }
      .books-row {
        gap: 8px;
      }
      .book-item {
        width: 29vw;
        border-radius: 12px;
      }
      .topics-columns-container {
        gap: 6px;
      }
      .unit-pill-btn {
        border-radius: 14px;
        font-size: 0.8rem;
        padding: 12px 2px;
      }
      .column-title {
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>

  <main class="app-card">
    
    <!-- 頂部標題區 -->
    <header class="header-box">
      <h1 class="main-title">
        <span class="bracket">(</span>
        Let’s Speak
        <span class="bracket">)</span>
      </h1>
      <div class="arch-curve"></div>
    </header>

    <!-- 1. 扉頁（首頁）：三本書與 START 按鈕 -->
    <section id="view-cover" class="view-section active">
      <div class="books-row">
        <!-- 第 1 本書 -->
        <div class="book-item" title="Book 1 (U1-U15)">
          <img src="images/book 1.png" alt="Let's Speak Book 1" onerror="this.src='https://placehold.co/240x350/e0e7ff/1e3a8a?text=Book+1'">
        </div>
        <!-- 第 2 本書 -->
        <div class="book-item" title="Book 2 (U1-U15)">
          <img src="images/book 2.png" alt="Let's Speak Book 2" onerror="this.src='https://placehold.co/240x350/fef2f2/ef4444?text=Book+2'">
        </div>
        <!-- 第 3 本書 -->
        <div class="book-item" title="Book 3 (U1-U15)">
          <img src="images/book 3.png" alt="Let's Speak Book 3" onerror="this.src='https://placehold.co/240x350/ecfdf5/047857?text=Book+3'">
        </div>
      </div>

      <button id="start-btn" class="btn-capsule" onclick="navigateTo('view-topics')">START</button>
    </section>

    <!-- 2. 選單頁（9 大主題：3 欄 x 3 列） -->
    <section id="view-topics" class="view-section">
      <div class="topics-columns-container">
        
        <!-- Book 1 欄位 -->
        <div class="book-column">
          <div class="column-title">Book 1</div>
          <button class="unit-pill-btn book1" onclick="openTopic('Book 1', 'U1 - U5')">U1 - U5</button>
          <button class="unit-pill-btn book1" onclick="openTopic('Book 1', 'U6 - U10')">U6 - U10</button>
          <button class="unit-pill-btn book1" onclick="openTopic('Book 1', 'U11 - U15')">U11 - U15</button>
        </div>

        <!-- Book 2 欄位 -->
        <div class="book-column">
          <div class="column-title">Book 2</div>
          <button class="unit-pill-btn book2" onclick="openTopic('Book 2', 'U1 - U5')">U1 - U5</button>
          <button class="unit-pill-btn book2" onclick="openTopic('Book 2', 'U6 - U10')">U6 - U10</button>
          <button class="unit-pill-btn book2" onclick="openTopic('Book 2', 'U11 - U15')">U11 - U15</button>
        </div>

        <!-- Book 3 欄位 -->
        <div class="book-column">
          <div class="column-title">Book 3</div>
          <button class="unit-pill-btn book3" onclick="openTopic('Book 3', 'U1 - U5')">U1 - U5</button>
          <button class="unit-pill-btn book3" onclick="openTopic('Book 3', 'U6 - U10')">U6 - U10</button>
          <button class="unit-pill-btn book3" onclick="openTopic('Book 3', 'U11 - U15')">U11 - U15</button>
        </div>

      </div>

      <button class="btn-back" onclick="navigateTo('view-cover')">← 返回封面</button>
    </section>

    <!-- 3. 作答練習區（預留資料空槽） -->
    <section id="view-quiz" class="view-section">
      <div class="quiz-view-wrapper">
        <div id="quiz-badge" class="quiz-header-badge">Book 1 • U1 - U5</div>
        
        <div class="coming-soon-box">
          <div class="coming-soon-icon">🎧</div>
          <div class="coming-soon-text">題目準備中</div>
          <div class="coming-soon-sub">音檔、圖片與題庫載入中，待題庫填入後即可開始作答。</div>
        </div>

        <button class="btn-back" onclick="navigateTo('view-topics')">← 返回選單</button>
      </div>
    </section>

  </main>

  <script>
    const quizDatabase = {
      "Book 1": {
        "U1 - U5": [],
        "U6 - U10": [],
        "U11 - U15": []
      },
      "Book 2": {
        "U1 - U5": [],
        "U6 - U10": [],
        "U11 - U15": []
      },
      "Book 3": {
        "U1 - U5": [],
        "U6 - U10": [],
        "U11 - U15": []
      }
    };

    function navigateTo(targetViewId) {
      document.querySelectorAll('.view-section').forEach(view => {
        view.classList.remove('active');
      });
      const targetView = document.getElementById(targetViewId);
      if (targetView) {
        targetView.classList.add('active');
      }
    }

    function openTopic(bookName, unitRange) {
      const badge = document.getElementById('quiz-badge');
      badge.textContent = `${bookName} • ${unitRange}`;
      navigateTo('view-quiz');
    }
  </script>
</body>
</html>

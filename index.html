<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Let’s Speak</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #dbeafe 0%, #fce7f3 50%, #ede9fe 100%);
      --card-bg: #ffffff;
      --card-shadow: 0 15px 35px rgba(148, 163, 184, 0.35);
      --primary-blue: #1e3a8a;
      --accent-coral: #ef4444;
      --accent-green: #10b981;
      --accent-purple: #8b5cf6;
      --accent-orange: #f97316;
      --btn-bg: #ffffff;
      --btn-text: #1e293b;
      --btn-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      --btn-hover-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--bg-gradient);
      padding: 24px;
    }

    /* 主卡片容器 */
    .app-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 580px;
      min-height: 480px;
      border-radius: 36px;
      box-shadow: var(--card-shadow);
      padding: 40px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      transition: all 0.3s ease;
    }

    /* 頂部手繪感弧線標題 ( Let’s Speak ) */
    .header-box {
      text-align: center;
      margin-bottom: 28px;
    }

    .main-title {
      font-size: 2.2rem;
      font-weight: 800;
      color: #1e293b;
      letter-spacing: 0.5px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .bracket {
      color: #94a3b8;
      font-weight: 300;
      font-size: 2.4rem;
    }

    .arch-curve {
      width: 80%;
      height: 6px;
      margin: 2px auto 0;
      border-radius: 50%;
      border-top: 2px solid #cbd5e1;
    }

    /* 頁面切換控制 */
    .view-section {
      width: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.3s ease-in-out;
    }

    .view-section.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ================= 扉頁（首頁） ================= */
    .books-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      width: 100%;
      margin: 10px 0 36px;
    }

    .book-item {
      position: relative;
      width: 125px;
      aspect-ratio: 1 / 1.45;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 22px rgba(30, 41, 59, 0.16);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      cursor: pointer;
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .book-item:hover {
      transform: translateY(-5px) scale(1.03);
      box-shadow: 0 16px 28px rgba(30, 41, 59, 0.22);
    }

    .book-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* START 按鈕 */
    .btn-capsule {
      background: var(--btn-bg);
      color: #334155;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      border: 1.5px solid #e2e8f0;
      padding: 12px 52px;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: var(--btn-shadow);
      transition: all 0.2s ease;
    }

    .btn-capsule:hover {
      transform: translateY(-2px);
      box-shadow: var(--btn-hover-shadow);
      border-color: #cbd5e1;
      color: #0f172a;
    }

    .btn-capsule:active {
      transform: translateY(0);
    }

    /* ================= 選單頁（9 大主題） ================= */
    .topics-columns-container {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 24px;
    }

    .book-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .column-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #64748b;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .unit-pill-btn {
      width: 100%;
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      border-radius: 20px;
      padding: 12px 6px;
      font-size: 0.95rem;
      font-weight: 700;
      color: #334155;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(0,0,0,0.04);
      transition: all 0.2s ease;
      text-align: center;
    }

    .unit-pill-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(0,0,0,0.08);
      border-color: #94a3b8;
      color: #0f172a;
    }

    .unit-pill-btn.book1:hover { border-color: #ef4444; color: #ef4444; }
    .unit-pill-btn.book2:hover { border-color: #3b82f6; color: #3b82f6; }
    .unit-pill-btn.book3:hover { border-color: #10b981; color: #10b981; }

    /* 返回按鈕 */
    .btn-back {
      background: transparent;
      border: none;
      color: #64748b;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: color 0.2s;
    }

    .btn-back:hover {
      color: #0f172a;
    }

    /* ================= 題目頁面 ================= */
    .quiz-view-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .quiz-header-badge {
      display: inline-block;
      padding: 4px 14px;
      background: #f1f5f9;
      color: #475569;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .coming-soon-box {
      padding: 30px 20px;
      background: #f8fafc;
      border: 2px dashed #cbd5e1;
      border-radius: 20px;
      width: 100%;
      max-width: 420px;
      margin-bottom: 24px;
    }

    .coming-soon-icon {
      font-size: 2.2rem;
      margin-bottom: 8px;
    }

    .coming-soon-text {
      color: #475569;
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .coming-soon-sub {
      color: #94a3b8;
      font-size: 0.85rem;
      line-height: 1.4;
    }

    /* 響應式微調 */
    @media (max-width: 480px) {
      .app-card {
        padding: 30px 18px;
        border-radius: 26px;
      }
      .main-title {
        font-size: 1.8rem;
      }
      .bracket {
        font-size: 1.9rem;
      }
      .book-item {
        width: 95px;
      }
      .unit-pill-btn {
        font-size: 0.85rem;
        padding: 10px 4px;
      }
    }
  </style>
</head>
<body>

  <main class="app-card">
    
    <!-- 頂部標題區 -->
    <header class="header-box">
      <h1 class="main-title">
        <span class="bracket">(</span>
        Let’s Speak
        <span class="bracket">)</span>
      </h1>
      <div class="arch-curve"></div>
    </header>

    <!-- 1. 扉頁（首頁）：三本書與 START 按鈕 -->
    <section id="view-cover" class="view-section active">
      <div class="books-row">
        <!-- 第 1 本書 -->
        <div class="book-item" title="Book 1 (U1-U15)">
          <img src="images/book 1.png" alt="Let's Speak Book 1" onerror="this.src='https://placehold.co/240x350/e0e7ff/1e3a8a?text=Book+1'">
        </div>
        <!-- 第 2 本書 -->
        <div class="book-item" title="Book 2 (U1-U15)">
          <img src="images/book 2.png" alt="Let's Speak Book 2" onerror="this.src='https://placehold.co/240x350/fef2f2/ef4444?text=Book+2'">
        </div>
        <!-- 第 3 本書 -->
        <div class="book-item" title="Book 3 (U1-U15)">
          <img src="images/book 3.png" alt="Let's Speak Book 3" onerror="this.src='https://placehold.co/240x350/ecfdf5/047857?text=Book+3'">
        </div>
      </div>

      <button id="start-btn" class="btn-capsule" onclick="navigateTo('view-topics')">START</button>
    </section>

    <!-- 2. 選單頁（9 大主題：3 欄 x 3 列） -->
    <section id="view-topics" class="view-section">
      <div class="topics-columns-container">
        
        <!-- Book 1 欄位 -->
        <div class="book-column">
          <div class="column-title">Book 1</div>
          <button class="unit-pill-btn book1" onclick="openTopic('Book 1', 'U1 - U5')">U1 - U5</button>
          <button class="unit-pill-btn book1" onclick="openTopic('Book 1', 'U6 - U10')">U6 - U10</button>
          <button class="unit-pill-btn book1" onclick="openTopic('Book 1', 'U11 - U15')">U11 - U15</button>
        </div>

        <!-- Book 2 欄位 -->
        <div class="book-column">
          <div class="column-title">Book 2</div>
          <button class="unit-pill-btn book2" onclick="openTopic('Book 2', 'U1 - U5')">U1 - U5</button>
          <button class="unit-pill-btn book2" onclick="openTopic('Book 2', 'U6 - U10')">U6 - U10</button>
          <button class="unit-pill-btn book2" onclick="openTopic('Book 2', 'U11 - U15')">U11 - U15</button>
        </div>

        <!-- Book 3 欄位 -->
        <div class="book-column">
          <div class="column-title">Book 3</div>
          <button class="unit-pill-btn book3" onclick="openTopic('Book 3', 'U1 - U5')">U1 - U5</button>
          <button class="unit-pill-btn book3" onclick="openTopic('Book 3', 'U6 - U10')">U6 - U10</button>
          <button class="unit-pill-btn book3" onclick="openTopic('Book 3', 'U11 - U15')">U11 - U15</button>
        </div>

      </div>

      <button class="btn-back" onclick="navigateTo('view-cover')">← 返回封面</button>
    </section>

    <!-- 3. 作答練習區（預留資料空槽） -->
    <section id="view-quiz" class="view-section">
      <div class="quiz-view-wrapper">
        <div id="quiz-badge" class="quiz-header-badge">Book 1: U1 - U5</div>
        
        <div class="coming-soon-box">
          <div class="coming-soon-icon">🎧</div>
          <div class="coming-soon-text">題目準備中</div>
          <div class="coming-soon-sub">音檔、圖片與題庫載入中，待題庫填入後即可開始作答。</div>
        </div>

        <button class="btn-back" onclick="navigateTo('view-topics')">← 返回選單</button>
      </div>
    </section>

  </main>

  <script>
    /* ========================================================
     * 題庫與音檔配置區塊（後續拿到題目後直接填入）
     * 格式範例：
     * {
     *   question: "題目敘述或聽力提示",
     *   audio: "audio/b1_u1_q1.mp3",  // 音檔路徑
     *   image: "images/q1.png",       // 圖片路徑
     *   options: ["A", "B", "C", "D"], // 選項
     *   answer: 0                     // 正確答案索引 (0~3)
     * }
     * ======================================================== */
    const quizDatabase = {
      "Book 1": {
        "U1 - U5": [],
        "U6 - U10": [],
        "U11 - U15": []
      },
      "Book 2": {
        "U1 - U5": [],
        "U6 - U10": [],
        "U11 - U15": []
      },
      "Book 3": {
        "U1 - U5": [],
        "U6 - U10": [],
        "U11 - U15": []
      }
    };

    // 頁面切換控制函式
    function navigateTo(targetViewId) {
      document.querySelectorAll('.view-section').forEach(view => {
        view.classList.remove('active');
      });
      const targetView = document.getElementById(targetViewId);
      if (targetView) {
        targetView.classList.add('active');
      }
    }

    // 點擊 9 大主題按鈕
    function openTopic(bookName, unitRange) {
      const badge = document.getElementById('quiz-badge');
      badge.textContent = `${bookName} • ${unitRange}`;
      navigateTo('view-quiz');
    }
  </script>
</body>
</html>

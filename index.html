<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Let’s Speak</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #dbeafe 0%, #fce7f3 50%, #ede9fe 100%);
      --card-bg: #ffffff;
      --card-shadow: 0 20px 45px rgba(148, 163, 184, 0.4);
      --btn-bg: #ffffff;
      --btn-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
      --btn-hover-shadow: 0 10px 24px rgba(0, 0, 0, 0.14);
      --primary-color: #2563eb;
      --success-color: #10b981;
      --error-color: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--bg-gradient);
      padding: env(safe-area-inset-top, 16px) env(safe-area-inset-right, 16px) env(safe-area-inset-bottom, 16px) env(safe-area-inset-left, 16px);
      overflow-x: hidden;
    }

    .app-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 960px;
      height: 92vh;
      height: 92dvh;
      border-radius: 36px;
      box-shadow: var(--card-shadow);
      padding: clamp(16px, 3vh, 36px) clamp(16px, 3.5vw, 40px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }

    .header-box {
      text-align: center;
      flex-shrink: 0;
    }

    .main-title {
      font-size: clamp(1.8rem, 3.8vh, 3rem);
      font-weight: 800;
      color: #1e293b;
      letter-spacing: 0.5px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .bracket {
      color: #94a3b8;
      font-weight: 300;
      font-size: clamp(2rem, 4vh, 3.4rem);
    }

    .arch-curve {
      width: 85%;
      height: 6px;
      margin: 2px auto 0;
      border-radius: 50%;
      border-top: 3px solid #cbd5e1;
    }

    .view-section {
      width: 100%;
      flex: 1;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.25s ease-in-out;
      overflow-y: auto;
    }

    .view-section.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ================= 首頁 ================= */
    .books-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: clamp(10px, 2.5vw, 36px);
      width: 100%;
      margin: auto 0;
    }

    .book-item {
      position: relative;
      width: min(28vw, 190px);
      aspect-ratio: 1 / 1.45;
      max-height: 48vh;
      border-radius: clamp(10px, 2vw, 18px);
      overflow: hidden;
      box-shadow: 0 10px 24px rgba(30, 41, 59, 0.16);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .book-item:hover {
      transform: translateY(-5px) scale(1.02);
      box-shadow: 0 18px 32px rgba(30, 41, 59, 0.22);
    }

    .book-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .btn-capsule {
      background: var(--btn-bg);
      color: #334155;
      font-size: clamp(1.1rem, 2vh, 1.4rem);
      font-weight: 800;
      letter-spacing: 1.5px;
      border: 2px solid #e2e8f0;
      padding: clamp(12px, 1.8vh, 16px) clamp(44px, 6vw, 84px);
      border-radius: 50px;
      cursor: pointer;
      box-shadow: var(--btn-shadow);
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .btn-capsule:hover {
      transform: translateY(-2px);
      box-shadow: var(--btn-hover-shadow);
      border-color: #cbd5e1;
      color: #0f172a;
    }

    /* ================= 9 大主題選單 ================= */
    .topics-columns-container {
      width: 100%;
      max-width: 760px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(8px, 2vw, 24px);
      margin: auto 0;
    }

    .book-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(10px, 1.8vh, 18px);
    }

    .column-title {
      font-size: clamp(0.95rem, 1.8vh, 1.25rem);
      font-weight: 800;
      color: #64748b;
      margin-bottom: 2px;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .unit-pill-btn {
      width: 100%;
      background: #ffffff;
      border: 1.8px solid #e2e8f0;
      border-radius: 20px;
      padding: clamp(10px, 1.6vh, 18px) 4px;
      font-size: clamp(0.82rem, 1.6vh, 1.15rem);
      font-weight: 700;
      color: #334155;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(0,0,0,0.04);
      transition: all 0.2s ease;
      text-align: center;
      white-space: nowrap;
    }

    .unit-pill-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(0,0,0,0.08);
    }

    .unit-pill-btn.book1:hover { border-color: #ef4444; color: #ef4444; }
    .unit-pill-btn.book2:hover { border-color: #3b82f6; color: #3b82f6; }
    .unit-pill-btn.book3:hover { border-color: #10b981; color: #10b981; }

    .btn-back {
      background: transparent;
      border: none;
      color: #64748b;
      font-size: clamp(0.9rem, 1.6vh, 1.1rem);
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-back:hover { color: #0f172a; }

    /* ================= 第一大題：單字排序 ================= */
    .quiz-view-wrapper {
      width: 100%;
      max-width: 780px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: auto 0;
      padding: 10px 0;
    }

    .quiz-nav-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .quiz-badge {
      padding: 4px 16px;
      background: #eff6ff;
      color: #1d4ed8;
      border-radius: 20px;
      font-size: 0.95rem;
      font-weight: 700;
    }

    .quiz-instruction-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #f8fafc;
      padding: 8px 18px;
      border-radius: 30px;
      border: 1px solid #e2e8f0;
      margin-bottom: 14px;
    }

    .btn-audio {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #3b82f6;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(59, 130, 246, 0.3);
      transition: all 0.2s;
    }

    .btn-audio:hover {
      background: #2563eb;
      transform: scale(1.03);
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(10px, 1.8vw, 16px);
      width: 100%;
      margin-bottom: 16px;
    }

    .order-card {
      position: relative;
      background: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: 14px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 3px 8px rgba(0,0,0,0.04);
      user-select: none;
    }

    .order-card:hover {
      border-color: #94a3b8;
      transform: translateY(-2px);
    }

    .order-card.selected {
      border-color: #3b82f6;
      background: #f0f7ff;
    }

    .order-card.correct {
      border-color: var(--success-color);
      background: #f0fdf4;
    }

    .order-card.wrong {
      border-color: var(--error-color);
      background: #fef2f2;
    }

    .circle-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid #60a5fa;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      font-weight: 800;
      color: #2563eb;
      box-shadow: 0 2px 5px rgba(0,0,0,0.06);
    }

    .order-card.selected .circle-badge {
      background: #2563eb;
      color: #ffffff;
      border-color: #2563eb;
    }

    .card-thumb {
      width: 100%;
      aspect-ratio: 16 / 10;
      border-radius: 8px;
      overflow: hidden;
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 6px;
    }

    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-word {
      font-size: clamp(0.85rem, 1.4vh, 1.05rem);
      font-weight: 700;
      color: #1e293b;
    }

    .quiz-controls {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .btn-action {
      background: #1e293b;
      color: white;
      border: none;
      padding: 8px 24px;
      border-radius: 20px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-action:hover {
      background: #0f172a;
      transform: translateY(-1px);
    }

    .btn-reset {
      background: #e2e8f0;
      color: #475569;
    }

    .feedback-msg {
      font-size: 0.95rem;
      font-weight: 700;
      margin-top: 8px;
      min-height: 24px;
    }

    /* ================= 第二大題：句子回應選擇 ================= */
    .part-b-box {
      width: 100%;
      max-width: 620px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: auto 0;
    }

    .audio-play-big-btn {
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 50px;
      padding: 12px 32px;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
      margin-bottom: 24px;
      transition: all 0.2s;
    }

    .audio-play-big-btn:hover {
      background: #1d4ed8;
      transform: translateY(-2px);
    }

    .options-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .option-btn {
      width: 100%;
      background: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      padding: 14px 20px;
      font-size: 1.05rem;
      font-weight: 700;
      color: #1e293b;
      cursor: pointer;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s;
      box-shadow: 0 3px 6px rgba(0,0,0,0.03);
    }

    .option-btn:hover:not(:disabled) {
      border-color: #3b82f6;
      background: #f8fafc;
      transform: translateX(4px);
    }

    .option-btn.correct {
      border-color: var(--success-color);
      background: #ecfdf5;
      color: #065f46;
    }

    .option-btn.wrong {
      border-color: var(--error-color);
      background: #fef2f2;
      color: #991b1b;
    }

    .option-label {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      font-weight: 800;
      color: #475569;
      flex-shrink: 0;
    }

    .option-btn.correct .option-label {
      background: var(--success-color);
      color: white;
    }

    .option-btn.wrong .option-label {
      background: var(--error-color);
      color: white;
    }

    /* 準備中視圖 */
    .coming-soon-box {
      padding: clamp(24px, 4vh, 36px) 16px;
      background: #f8fafc;
      border: 2px dashed #cbd5e1;
      border-radius: 24px;
      width: 100%;
      max-width: 460px;
      text-align: center;
      margin: auto 0;
    }

    @media (max-width: 480px) {
      body { padding: 10px; }
      .app-card { height: 94dvh; border-radius: 28px; padding: 18px 12px; }
      .cards-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .card-word { font-size: 0.8rem; }
      .circle-badge { width: 24px; height: 24px; font-size: 0.8rem; }
      .option-btn { font-size: 0.95rem; padding: 12px 14px; }
    }
  </style>
</head>
<body>

  <main class="app-card">
    
    <!-- 頂部標題區 -->
    <header class="header-box">
      <h1 class="main-title">
        <span class="bracket">(</span>
        Let’s Speak
        <span class="bracket">)</span>
      </h1>
      <div class="arch-curve"></div>
    </header>

    <!-- 1. 扉頁（首頁） -->
    <section id="view-cover" class="view-section active">
      <div class="books-row">
        <div class="book-item" title="Book 1 (U1-U15)">
          <img src="images/book 1.png" alt="Let's Speak Book 1" onerror="this.src='https://placehold.co/240x350/e0e7ff/1e3a8a?text=Book+1'">
        </div>
        <div class="book-item" title="Book 2 (U1-U15)">
          <img src="images/book 2.png" alt="Let's Speak Book 2" onerror="this.src='https://placehold.co/240x350/fef2f2/ef4444?text=Book+2'">
        </div>
        <div class="book-item" title="Book 3 (U1-U15)">
          <img src="images/book 3.png" alt="Let's Speak Book 3" onerror="this.src='https://placehold.co/240x350/ecfdf5/047857?text=Book+3'">
        </div>
      </div>
      <button id="start-btn" class="btn-capsule" onclick="navigateTo('view-topics')">START</button>
    </section>

    <!-- 2. 選單頁（9 大主題） -->
    <section id="view-topics" class="view-section">
      <div class="topics-columns-container">
        <!-- Book 1 -->
        <div class="book-column">
          <div class="column-title">Book 1</div>
          <button class="unit-pill-btn book1" onclick="startFullQuizFlow()">U1 - U5</button>
          <button class="unit-pill-btn book1" onclick="openComingSoon('Book 1', 'U6 - U10')">U6 - U10</button>
          <button class="unit-pill-btn book1" onclick="openComingSoon('Book 1', 'U11 - U15')">U11 - U15</button>
        </div>
        <!-- Book 2 -->
        <div class="book-column">
          <div class="column-title">Book 2</div>
          <button class="unit-pill-btn book2" onclick="openComingSoon('Book 2', 'U1 - U5')">U1 - U5</button>
          <button class="unit-pill-btn book2" onclick="openComingSoon('Book 2', 'U6 - U10')">U6 - U10</button>
          <button class="unit-pill-btn book2" onclick="openComingSoon('Book 2', 'U11 - U15')">U11 - U15</button>
        </div>
        <!-- Book 3 -->
        <div class="book-column">
          <div class="column-title">Book 3</div>
          <button class="unit-pill-btn book3" onclick="openComingSoon('Book 3', 'U1 - U5')">U1 - U5</button>
          <button class="unit-pill-btn book3" onclick="openComingSoon('Book 3', 'U6 - U10')">U6 - U10</button>
          <button class="unit-pill-btn book3" onclick="openComingSoon('Book 3', 'U11 - U15')">U11 - U15</button>
        </div>
      </div>
      <button class="btn-back" onclick="navigateTo('view-cover')">← 返回封面</button>
    </section>

    <!-- 3. 第一大題：單字聽力排序 -->
    <section id="view-quiz-partA" class="view-section">
      <div class="quiz-view-wrapper">
        <div class="quiz-nav-row">
          <span class="quiz-badge">第一大題 • 單字排序</span>
          <span id="partA-progress-badge" style="font-size: 0.85rem; color: #64748b; font-weight: 600;">回合 1 / 3</span>
        </div>

        <div class="quiz-instruction-bar">
          <button class="btn-audio" onclick="playCurrentRoundAudio()">
            <span>🔊 播放音檔</span>
          </button>
          <span style="font-size: 0.85rem; color: #475569; font-weight: 600;">聽音檔順序為圖片填入 1~6</span>
        </div>

        <div id="cards-container" class="cards-grid"></div>

        <div class="quiz-controls">
          <button class="btn-action btn-reset" onclick="resetUserOrder()">重置順序</button>
          <button class="btn-action" onclick="submitPartAAnswer()">送出答案</button>
          <button id="btn-next-round" class="btn-action" style="background:#2563eb; display:none;" onclick="nextPartARound()">下一回 →</button>
          <button id="btn-to-partB" class="btn-action" style="background:#10b981; display:none;" onclick="startPartB()">進入第二大題 →</button>
        </div>

        <div id="partA-feedback-text" class="feedback-msg"></div>
        <button class="btn-back" onclick="navigateTo('view-topics')">← 返回選單</button>
      </div>
    </section>

    <!-- 4. 第二大題：句子回應聽力選擇 (10 題抽 5 題) -->
    <section id="view-quiz-partB" class="view-section">
      <div class="part-b-box">
        <div class="quiz-nav-row">
          <span class="quiz-badge" style="background: #fdf2f8; color: #be185d;">第二大題 • 聽力問答</span>
          <span id="partB-progress-badge" style="font-size: 0.85rem; color: #64748b; font-weight: 600;">第 1 / 5 題</span>
        </div>

        <!-- 依精準時間段播放長音檔 -->
        <button class="audio-play-big-btn" onclick="playPartBCurrentAudio()">
          <span>🔊 播放題目語音</span>
        </button>

        <div class="options-list" id="options-container"></div>

        <div id="partB-feedback-text" class="feedback-msg"></div>

        <button id="btn-next-partB" class="btn-action" style="background:#2563eb; display:none; margin-top:10px;" onclick="nextPartBQuestion()">下一題 →</button>
        <button id="btn-finish-all" class="btn-action" style="background:#10b981; display:none; margin-top:10px;" onclick="finishAllQuizzes()">完成所有練習 🎉</button>

        <button class="btn-back" onclick="navigateTo('view-topics')">← 返回選單</button>
      </div>
    </section>

    <!-- 5. 建設中提示區 -->
    <section id="view-coming-soon" class="view-section">
      <div class="coming-soon-box">
        <div style="font-size: 3rem; margin-bottom: 12px;">🎧</div>
        <h3 id="cs-title" style="color: #1e293b; margin-bottom: 8px;">單元準備中</h3>
        <p style="color: #64748b; font-size: 0.9rem;">此範圍之題庫與音檔即將上線！</p>
      </div>
      <button class="btn-back" onclick="navigateTo('view-topics')">← 返回選單</button>
    </section>

  </main>

  <!-- 引入獨立題庫檔 -->
  <script src="book1_u1_u5.js"></script>

  <script>
    // 全域音訊物件（共用長音檔）
    let partBAudio = null;
    let audioStopTimer = null;

    // 第一大題變數
    const TOTAL_PART_A_ROUNDS = 3;
    const ITEMS_PER_ROUND = 6;
    let partAGeneratedRounds = [];
    let currentPartARoundIdx = 0;
    let partASelections = [];

    // 第二大題變數
    const TOTAL_PART_B_QUESTIONS = 5;
    let partBPickedQuestions = [];
    let currentPartBQuestionIdx = 0;
    let partBScore = 0;

    function navigateTo(targetViewId) {
      // 切換頁面時停止播放音檔
      if (partBAudio) {
        partBAudio.pause();
        clearTimeout(audioStopTimer);
      }
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }

      document.querySelectorAll('.view-section').forEach(view => {
        view.classList.remove('active');
      });
      const targetView = document.getElementById(targetViewId);
      if (targetView) targetView.classList.add('active');
    }

    function openComingSoon(bookName, range) {
      document.getElementById('cs-title').textContent = `${bookName} • ${range}`;
      navigateTo('view-coming-soon');
    }

    /* ================= 啟動整個練習流程 ================= */
    function startFullQuizFlow() {
      if (typeof book1_U1_U5_Data === 'undefined' || typeof book1_PartB_Data === 'undefined') {
        alert('請確認已在專案中正確引入 book1_u1_u5.js 題庫！');
        return;
      }
      initPartA();
      navigateTo('view-quiz-partA');
    }

    /* ================= 第一大題邏輯 ================= */
    function initPartA() {
      // 1. 合併 5 個單元單字 (共 30 個)
      let allItemsPool = [];
      book1_U1_U5_Data.forEach(unitData => {
        unitData.items.forEach(item => {
          allItemsPool.push({ ...item, sourceUnit: unitData.unit });
        });
      });

      // 2. 隨機生成 3 回合
      partAGeneratedRounds = [];
      let shuffledPool = [...allItemsPool].sort(() => Math.random() - 0.5);

      for (let r = 0; r < TOTAL_PART_A_ROUNDS; r++) {
        if (shuffledPool.length < ITEMS_PER_ROUND) {
          shuffledPool = [...allItemsPool].sort(() => Math.random() - 0.5);
        }
        const picked = shuffledPool.splice(0, ITEMS_PER_ROUND);
        const displayItems = [...picked].sort(() => Math.random() - 0.5);
        const correctSequenceWords = [...picked].sort(() => Math.random() - 0.5).map(i => i.word);

        partAGeneratedRounds.push({
          round: r + 1,
          displayItems: displayItems,
          correctOrderWords: correctSequenceWords
        });
      }

      currentPartARoundIdx = 0;
      loadPartARound(currentPartARoundIdx);
    }

    function loadPartARound(roundIdx) {
      const roundData = partAGeneratedRounds[roundIdx];
      partASelections = [];

      document.getElementById('partA-progress-badge').textContent = `回合 ${roundIdx + 1} / ${TOTAL_PART_A_ROUNDS}`;
      document.getElementById('partA-feedback-text').textContent = '';
      document.getElementById('btn-next-round').style.display = 'none';
      document.getElementById('btn-to-partB').style.display = 'none';

      const container = document.getElementById('cards-container');
      container.innerHTML = '';

      roundData.displayItems.forEach(item => {
        const card = document.createElement('div');
        card.className = 'order-card';
        card.id = `card-${item.id}`;
        card.onclick = () => toggleSelectPartACard(item.word);

        card.innerHTML = `
          <div class="circle-badge" id="badge-${item.word}"></div>
          <div class="card-thumb">
            <img src="${item.image}" alt="${item.word}" onerror="this.src='https://placehold.co/300x180/f1f5f9/64748b?text=${encodeURIComponent(item.word)}'">
          </div>
          <div class="card-word">${item.word}</div>
        `;
        container.appendChild(card);
      });
    }

    function toggleSelectPartACard(word) {
      const existingIndex = partASelections.indexOf(word);
      if (existingIndex > -1) {
        partASelections.splice(existingIndex, 1);
      } else {
        if (partASelections.length < ITEMS_PER_ROUND) {
          partASelections.push(word);
        }
      }
      updatePartACardsUI();
    }

    function updatePartACardsUI() {
      const roundData = partAGeneratedRounds[currentPartARoundIdx];
      roundData.displayItems.forEach(item => {
        const card = document.getElementById(`card-${item.id}`);
        const badge = document.getElementById(`badge-${item.word}`);
        const orderIndex = partASelections.indexOf(item.word);

        if (orderIndex > -1) {
          card.classList.add('selected');
          badge.textContent = orderIndex + 1;
        } else {
          card.classList.remove('selected', 'correct', 'wrong');
          badge.textContent = '';
        }
      });
    }

    function resetUserOrder() {
      partASelections = [];
      updatePartACardsUI();
      document.getElementById('partA-feedback-text').textContent = '';
      document.getElementById('btn-next-round').style.display = 'none';
      document.getElementById('btn-to-partB').style.display = 'none';
    }

    function playCurrentRoundAudio() {
      const roundData = partAGeneratedRounds[currentPartARoundIdx];
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const textToSpeak = roundData.correctOrderWords.map((w, idx) => `Number ${idx + 1}, ${w}`).join('. ');
        const utterance = new SpeechSynthesisUtterance(textToSpeak);
        utterance.lang = 'en-US';
        utterance.rate = 0.88;
        window.speechSynthesis.speak(utterance);
      }
    }

    function submitPartAAnswer() {
      if (partASelections.length < ITEMS_PER_ROUND) {
        const fb = document.getElementById('partA-feedback-text');
        fb.style.color = '#ef4444';
        fb.textContent = '請先為全部 6 張圖片完成排序再送出！';
        return;
      }

      const roundData = partAGeneratedRounds[currentPartARoundIdx];
      let isAllCorrect = true;

      roundData.displayItems.forEach(item => {
        const card = document.getElementById(`card-${item.id}`);
        const userOrder = partASelections.indexOf(item.word);
        const correctOrder = roundData.correctOrderWords.indexOf(item.word);

        if (userOrder === correctOrder) {
          card.classList.add('correct');
        } else {
          card.classList.add('wrong');
          isAllCorrect = false;
        }
      });

      const fb = document.getElementById('partA-feedback-text');
      if (isAllCorrect) {
        fb.style.color = '#10b981';
        fb.textContent = '🎉 太棒了！本回排序全數正確！';
        if (currentPartARoundIdx < TOTAL_PART_A_ROUNDS - 1) {
          document.getElementById('btn-next-round').style.display = 'inline-block';
        } else {
          document.getElementById('btn-to-partB').style.display = 'inline-block';
        }
      } else {
        fb.style.color = '#ef4444';
        fb.textContent = '❌ 有部分順序錯誤，可點擊「重置順序」再試一次！';
      }
    }

    function nextPartARound() {
      currentPartARoundIdx++;
      loadPartARound(currentPartARoundIdx);
    }

    /* ================= 第二大題邏輯（10 抽 5） ================= */
    function startPartB() {
      // 10 題隨機抽 5 題
      const allQ = [...book1_PartB_Data.questions];
      partBPickedQuestions = allQ.sort(() => Math.random() - 0.5).slice(0, TOTAL_PART_B_QUESTIONS);
      currentPartBQuestionIdx = 0;
      partBScore = 0;

      // 初始化長音檔
      if (!partBAudio) {
        partBAudio = new Audio(book1_PartB_Data.audioFile);
      }

      navigateTo('view-quiz-partB');
      loadPartBQuestion(currentPartBQuestionIdx);
    }

    function loadPartBQuestion(qIdx) {
      const q = partBPickedQuestions[qIdx];
      document.getElementById('partB-progress-badge').textContent = `第 ${qIdx + 1} / ${TOTAL_PART_B_QUESTIONS} 題`;
      document.getElementById('partB-feedback-text').textContent = '';
      document.getElementById('btn-next-partB').style.display = 'none';
      document.getElementById('btn-finish-all').style.display = 'none';

      const container = document.getElementById('options-container');
      container.innerHTML = '';

      q.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `<span class="option-label">${opt.label}</span><span>${opt.text}</span>`;
        btn.onclick = () => selectPartBOption(opt.label, q.answer, btn);
        container.appendChild(btn);
      });

      // 自動播一次題目
      playPartBCurrentAudio();
    }

    // 在 index.html 中替換原有的 playPartBCurrentAudio 函式
function playPartBCurrentAudio() {
  const q = partBPickedQuestions[currentPartBQuestionIdx];
  if (!partBAudio) {
    partBAudio = new Audio(book1_PartB_Data.audioFile);
  }

  // 清除先前的事件與計時器
  partBAudio.pause();
  if (partBAudio._timeUpdateHandler) {
    partBAudio.removeEventListener('timeupdate', partBAudio._timeUpdateHandler);
  }

  // 設定起始播放時間點
  partBAudio.currentTime = q.start;

  // 使用 timeupdate 即時監控結束點，精準度高且不漂移
  partBAudio._timeUpdateHandler = function() {
    if (partBAudio.currentTime >= q.end) {
      partBAudio.pause();
      partBAudio.removeEventListener('timeupdate', partBAudio._timeUpdateHandler);
    }
  };
  partBAudio.addEventListener('timeupdate', partBAudio._timeUpdateHandler);

  partBAudio.play().catch(() => {
    // 找不到音檔時 fallback 語音朗讀
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(q.script);
      utterance.lang = 'en-US';
      utterance.rate = 0.9;
      window.speechSynthesis.speak(utterance);
    }
  });
}
    // 選擇答案
    function selectPartBOption(selectedLabel, correctLabel, clickedBtn) {
      // 停止音檔
      if (partBAudio) {
        partBAudio.pause();
        clearTimeout(audioStopTimer);
      }

      // 鎖定所有選項按鈕
      document.querySelectorAll('.option-btn').forEach(btn => {
        btn.disabled = true;
      });

      const fb = document.getElementById('partB-feedback-text');

      if (selectedLabel === correctLabel) {
        clickedBtn.classList.add('correct');
        fb.style.color = '#10b981';
        fb.textContent = '🎉 答對了！';
        partBScore++;
      } else {
        clickedBtn.classList.add('wrong');
        fb.style.color = '#ef4444';
        fb.textContent = `❌ 答錯了！正確答案是 (${correctLabel})`;
      }

      if (currentPartBQuestionIdx < TOTAL_PART_B_QUESTIONS - 1) {
        document.getElementById('btn-next-partB').style.display = 'inline-block';
      } else {
        document.getElementById('btn-finish-all').style.display = 'inline-block';
      }
    }

    function nextPartBQuestion() {
      currentPartBQuestionIdx++;
      loadPartBQuestion(currentPartBQuestionIdx);
    }

    function finishAllQuizzes() {
      alert(`🎉 恭喜完成所有練習！\n第二大題答對題數：${partBScore} / ${TOTAL_PART_B_QUESTIONS}`);
      navigateTo('view-topics');
    }
  </script>
